<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.6/dist/sweetalert2.min.css">
    <title>Kopi Nusantara</title>
</head>

<style>

:root {
    --color-main: white;
    --color-second :rgb(199, 150, 52);
}

@import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

*{
    font-family: "Poppins", sans-serif;
    margin: 0; padding: 0;
    box-sizing: border-box ;
    outline: none; border: none;
    text-decoration: none;
    text-transform: capitalize;
    transition: .2s linear;
}

.contact{
    min-height: 100vh;
    background: url("/Image/Contact\ Us\ Backgound.jpg");
    padding: 50px;
    background-size: cover;
    text-align: center;
}

.container{
    max-width: 900px;
    margin:0 auto;
    padding: 40px;
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 25px;
    background: transparent;
    backdrop-filter: blur(15px);
    animation: animate 1s ease-in-out 0.2s 1 backwards;
}

.container h2{
    font-size: 35px;
    margin-bottom: 5px;
    color: var(--color-main);
    padding-bottom: 40px;
}

.contact-wrapper{
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-gap: 30px ;
}

.contact-form{
    text-align: left;
}

.contact-form h3{
    font-size: 20px;
    margin-bottom: 20px;
    font-weight: 400px;
    text-align: center;
    color: rgba(255, 255, 255, 0.97);
    background:transparent;
    border: 1px solid rgb(255, 255, 255);
    backdrop-filter: blur(90px);
    border-radius: 15px;
    padding: 10px;
}

.form-group{
    margin-bottom: 20px;
}

.form-group ::placeholder {
    color: #000000;
}

input,textarea{
    width: 100%;
    padding: 10px;
    border-radius: 15px;
    border: none;
    background-color: #ffffff75;
    color: var(--color-main);
}

input:focus,
textarea:focus{
    outline: none;
    box-shadow: 0 0 8px #bbb;
}

button{
    background: #fff;
    outline: none;
    border: none;
    font-size: 1rem;
    padding: 12px 30px;
    font-weight: 700;
    margin-top: 38px;
    border-radius: 20px;
    cursor: pointer;
}

button:hover{
    color: #fff;
    background: #c06b3e;
}

.contain-info{
    text-align: left;
}

.contact-info h3{
    font-size: 20px;
    margin-bottom: 20px;
    border: 1px solid white;
    border-radius: 15px;
    padding: 10px;
    color: var(--color-main);
}
.contact-info p{
    margin-bottom: 10px;
    border: 1px solid rgba(234, 234, 234, 0);
    border-radius: 30px;
    padding: 20px;
    color: var(--color-main);
    font-weight: 500;
}

.contact-info i{
    color: var(--color-second);
    margin-right: 10px;
}

@media screen and(max-width:768px) {
    .container{
        padding: 20px;
    }
    .contact-wrapper{
        grid-template-columns: repeat 1fr;
    }
}

@keyframes animate {
    from{
        opacity: 0;
        transform: translate(0, 100px);
        filter: blur(33px);
    }

    to{
        opacity: 1;
        transform: translate(0);
        filter: blur(0);
    }
}

</style>

<body>
    <section class="contact">
        <div class="container">
            <h2>Contact US</h2>
        <div class="contact-wrapper">
            <div class="contact-form">
                <h3>Send us a message</h3>

                <form id="contact-form">
                    <div class="form-group">
                        <input type="text" name="name" id="name" placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" id="email" placeholder="Your Email">
                    </div>
                    <div class="form-group">
                        <textarea name="message" id="message" placeholder="Your message"></textarea>
                    </div>
                    <button type="submit">Send Message</button>
                </form>

            </div>
            <div class="contact-info">
                <h3>Contact Information</h3>
                <p> <i class="fas fa-phone"></i> +62 820 4536 7889 </p>
                <p> <i class="fas fa-envelope"></i> info@kopinusantara.com </p>
                <p> <i class="fas fa-map-marker-alt"></i>Jababeka, Cikarang, Indonesia</p>
            </div>
        </div>
      </div>
    </section>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.6.6/dist/sweetalert2.min.js"></script>

    <script>
        $(document).ready(function(){
            $('#contact-form').on('submit', function(e){
                e.preventDefault();

                var name = $('#name').val();
                var email = $('#email').val();
                var message = $('#message').val();

    
                if(name === "" || email === "" || message === ""){
                    Swal.fire({
                        icon: 'error',
                        title: 'Oops...',
                        text: 'Please fill all fields!',
                    });
                } else {
   
                    Swal.fire({
                        icon: 'success',
                        title: 'Message Sent!',
                        text: 'Your message has been sent successfully. We will get back to you soon.',
                    });

                    $('#name').val('');
                    $('#email').val('');
                    $('#message').val('');
                }
            });
        });
    </script>
</body>
</html>
