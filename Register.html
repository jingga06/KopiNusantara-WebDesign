<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Kopi Nusantara</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<style>
@import url("https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap");

* {
   margin: 0;
   padding: 0;
   box-sizing: border-box;
   font-family: "Poppins",sans-serif;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: url("/Image/pexels-apgpotr-683039.jpg") no-repeat;
    background-size: cover;
    background-position: center;
}

.wrapper {
    width: 420px;
    background: transparent;
    border: 2px solid rgba(255,255,255, .2);
    backdrop-filter: blur(10px);
    box-shadow: 0 0 10px rgba(0, 0, 0, .1);
    color: #fff;
    border-radius: 25px;
    padding: 30px 40px;
    animation: animate 1s ease-in-out 0.2s 1 backwards;
}

.wrapper h1{
    font-size: 36px;
    text-align: center;
}

.wrapper .input-box {
position: relative;    
width: 100%;
height: 50%;
margin: 15px 0;
}

.input-box input {
    width: 100%;
    height: 100%;
    background: transparent;
    border: none;
    outline: none;
    border: 2px solid rgba(255,255,255, .2);
    border-radius: 40px;
    font-size: 16px;
    color: #fff;
    padding: 20px 45px 20px 20px;
}

.input-box input::placeholder {
    color: #fff;
}

.input-box i {
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-weight: 20px;
}

.wrapper .acc {
    display: flex;
    justify-content: space-between;
    font-size: 14.5px;
    margin: -5px 0 15px;
}

.acc label input {
    accent-color: #fff;
    margin-right: 3px;
}

.wrapper .btn {
    width: 100%;
    height: 45px;
    background: #fff;
    border: none;
    outline: none;
    border-radius: 40px;
    box-shadow: 0 0 10px rgba(0, 0, 0, .1);
    cursor: pointer;
    font-size: 16px;
    color: #333;
    font-weight: 600;
}

.wrapper .register-link {
    font-size: 14.5px;
    text-align: center;
    margin: 20px 0 15px; 
}

.register-link p a {
    color: #fff;
    text-decoration: none;
    font-weight: 600;
}

.register-link p a:hover  {
    text-decoration: underline;
}

@keyframes animate {
    from{
        opacity: 0;
        transform: translate(0, 100px);
        filter: blur(33px);
    }

    to{
        opacity: 1;
        transform: translate(0);
        filter: blur(0);
    }
}
</style>

<body>

    <div class="wrapper">
        <form id="register-form" action="" method="post">
          <h1>Register</h1>

          <div class="input-box">
            <input type="email" id="email" placeholder="Email" required>
            <i class='bx bx-envelope'></i>
          </div>

          <div class="input-box">
            <input type="text" id="username" placeholder="Username" required>
            <i class='bx bxs-user'></i>
          </div>

          <div class="input-box">
            <input type="password" id="password" placeholder="Password" required>
            <i class='bx bxs-lock-alt' ></i>
          </div>

          <div class="input-box">
            <input type="password" id="confirm-password" placeholder="Confirm Password" required>
            <i class='bx bxs-lock' ></i>
          </div>

          <div class="acc"> 
            <label><input type="checkbox" id="accept-regulation"> Accept the Regulation</label>
          </div>
 
          <button type="submit" class="btn" id="register-btn">Register Now</button>

          <div class="register-link">
              <p>Want To Login? <a style="color: rgb(249, 190, 100);" href="/Login.html">Login</a></p>
          </div>
        </form>
    </div>

    <script>
    $(document).ready(function() {
        $('#register-form').submit(function(event) {
            event.preventDefault();

            const email = $('#email').val();
            const username = $('#username').val();
            const password = $('#password').val();
            const confirmPassword = $('#confirm-password').val();
            const acceptRegulation = $('#accept-regulation').is(':checked');

            if (password !== confirmPassword) {
                Swal.fire({
                    icon: 'error',
                    title: 'Oops...',
                    text: 'Passwords do not match!',
                    confirmButtonText: 'Try Again'
                });
                return false;
            }

            if (!acceptRegulation) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Please accept the regulation',
                    text: 'You must accept the terms and conditions to proceed.',
                    confirmButtonText: 'Understood'
                });
                return false;
            }

            Swal.fire({
                icon: 'success',
                title: 'Registration Successful!',
                text: 'You have successfully registered.',
                confirmButtonText: 'OK'
            });

        });
    });
    </script>

</body>

</html>
